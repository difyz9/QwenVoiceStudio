services:
  postgres:
    image: postgres:16-alpine
    container_name: qwen-voice-postgres
    environment:
      POSTGRES_DB: qwen_voice_studio
      POSTGRES_USER: qwen
      POSTGRES_PASSWORD: qwen123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwen -d qwen_voice_studio"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen-voice-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_NAME: Qwen Voice Studio
      DATABASE_URL: postgresql+psycopg://qwen:qwen123@postgres:5432/qwen_voice_studio
      JWT_SECRET: <CHANGE_ME>
      JWT_EXPIRE_MINUTES: 720
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      BACKEND_INTERNAL_URL: http://127.0.0.1:8000
      PRESET_SEED_FILE: /app/configs/voice_presets.array.example.json
      PRESET_LIBRARY_DIR: /app/assets/voice_presets
      SYNTHESIS_OUTPUT_DIR: /app/outputs/synthesis_jobs
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-Base
      QWEN_TTS_VOICE_DESIGN_MODEL: /app/models/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./assets:/app/assets

volumes:
  postgres_data: